! Image: quay.io/frrouting/frr:containerlab-10.7.1
! BGP-LS export and neighbor activation are deferred to r5-bgpls.conf.
frr defaults traditional
log stdout
!
hostname R5
ip forwarding
!
interface eth1
 ip address 10.5.0.1/32
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 link-params
 exit-link-params
exit
!
interface eth2
 ip address 192.0.2.1/30
exit
!
router isis CORE
 net 49.0001.0000.0000.0005.00
 is-type level-2-only
 metric-style wide
 mpls-te on
 mpls-te router-address 10.5.0.1
exit
!
router bgp 65005
 bgp router-id 10.5.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 65100
exit
