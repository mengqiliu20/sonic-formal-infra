! Image: quay.io/frrouting/frr:containerlab-10.7.1
frr defaults traditional
log stdout
!
hostname R4
ip forwarding
!
interface eth1
 ip address 10.4.0.1/32
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 link-params
 exit-link-params
exit
!
interface eth2
 ip address 10.4.0.2/32
 ip router isis CORE
 isis network point-to-point
 isis metric 20
 link-params
 exit-link-params
exit
!
interface eth3
 ip address 10.4.0.3/32
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 link-params
 exit-link-params
exit
!
router isis CORE
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 metric-style wide
 mpls-te on
 mpls-te router-address 10.4.0.3
exit
!
